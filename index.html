<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Online Text Tools</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 20px;
    color: #222;
}
.container {
    max-width: 700px;
    margin: 25px auto;
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 3px 15px #ccc;
}
h1, h2 {
    color: #174ea6;
}
textarea {
    width: 100%;
    height: 130px;
    box-sizing: border-box;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #aaa;
    border-radius: 8px;
}
button {
    padding: 11px 14px;
    margin: 5px 3px;
    border: 0;
    border-radius: 7px;
    background: #1769e0;
    color: white;
    cursor: pointer;
}
.result {
    font-weight: bold;
    margin: 12px 0;
}
hr {
    border: 0;
    border-top: 1px solid #ddd;
    margin: 25px 0;
}
</style>
</head>

<body>
<div class="container">

<h1>Free Online Text Tools</h1>
<p>Free tools to count words, change text case, and remove extra spaces.</p>

<h2>1. Word Counter</h2>
<textarea id="text" placeholder="Type or paste your text here..." oninput="countText()"></textarea>
<p class="result" id="result">Words: 0 | Characters: 0</p>
<button onclick="clearText()">Clear Text</button>

<hr>

<h2>2. Case Converter</h2>
<textarea id="caseText" placeholder="Enter text to convert..."></textarea>
<br>
<button onclick="convertCase('upper')">UPPERCASE</button>
<button onclick="convertCase('lower')">lowercase</button>
<button onclick="convertCase('title')">Title Case</button>
<button onclick="convertCase('sentence')">Sentence Case</button>
<button onclick="copyText()">Copy Text</button>
<p id="message"></p>

<hr>

<h2>3. Remove Extra Spaces</h2>
<textarea id="spaceText" placeholder="Paste your text here..."></textarea>
<br>
<button onclick="removeSpaces()">Remove Extra Spaces</button>
<p id="spaceResult"></p>

</div>

<script>
function countText() {
    const text = document.getElementById("text").value;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    document.getElementById("result").textContent =
        "Words: " + words + " | Characters: " + text.length;
}

function clearText() {
    document.getElementById("text").value = "";
    countText();
}

function convertCase(type) {
    const box = document.getElementById("caseText");
    let text = box.value;

    if (type === "upper") {
        text = text.toUpperCase();
    } else if (type === "lower") {
        text = text.toLowerCase();
    } else if (type === "title") {
        text = text.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
    } else if (type === "sentence") {
        text = text.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g, c => c.toUpperCase());
    }

    box.value = text;
    document.getElementById("message").textContent = "Text converted!";
}

function copyText() {
    const box = document.getElementById("caseText");
    box.select();

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(box.value)
            .then(() => {
                document.getElementById("message").textContent = "Text copied!";
            })
            .catch(() => {
                document.getElementById("message").textContent =
                    "Please select and copy the text manually.";
            });
    } else {
        const copied = document.execCommand("copy");
        document.getElementById("message").textContent =
            copied ? "Text copied!" : "Please copy the selected text manually.";
    }
}

function removeSpaces() {
    const box = document.getElementById("spaceText");
    box.value = box.value.replace(/\s+/g, " ").trim();
    document.getElementById("spaceResult").textContent = "Extra spaces removed!";
}
</script>

</body>
</html>
